<html xmlns:th="http://thymeleaf.org">

<head>
    <title>TodoApp</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            padding: 50px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        /* Add Todo form */
        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .add-form input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .add-form input:focus {
            border-color: #4f46e5;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .add-btn {
            background: #4f46e5;
            color: white;
        }

        .add-btn:hover {
            background: #4338ca;
        }

        /* Todo list */
        ul {
            list-style: none;
        }

        li {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            display: flex;
            align-items: center;
            gap: 10px;
        }

        .todo-form {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .todo-form input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .todo-form input[type="text"]:focus {
            border-color: #4f46e5;
        }

        .todo-form input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .update-btn {
            background: #16a34a;
            color: white;
        }

        .update-btn:hover {
            background: #15803d;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        @media (max-width: 600px) {
            li {
                flex-wrap: wrap;
            }

            .todo-form {
                width: 100%;
            }

            .add-form {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Todo App</h1>

    <!-- Add Todo -->
    <form action="/addtodo" method="post" class="add-form">

        <input
                type="text"
                name="taskContent"
                placeholder="Write your task"
                required>

        <button type="submit" class="add-btn">
            Add Todo
        </button>

    </form>

    <!-- Todo List -->
    <ul>

        <li th:each="todo : ${todoList}">

            <form
                    th:action="@{/updateTodo/{id}(id=${todo.id})}"
                    method="post"
                    class="todo-form">

                <input
                        type="text"
                        th:value="${todo.taskContent}"
                        name="taskContent">

                <input
                        type="checkbox"
                        th:checked="${todo.completionStatus}"
                        name="completionStatus"
                        onchange="this.form.submit()">

                <button type="submit" class="update-btn">
                    UPDATE
                </button>

            </form>

            <a
                    th:href="@{/deleteTodo/{id}(id=${todo.id})}"
                    class="delete-btn">
                Delete
            </a>

        </li>

    </ul>

</div>

</body>
</html>
